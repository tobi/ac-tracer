name: Build and Release

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Content Manager compatible package
        run: |
          # Create the folder structure for Content Manager drag & drop
          # CSP Lua apps go in: assettocorsa/apps/lua/<AppName>/
          mkdir -p package/apps/lua/ac-tracer

          # Copy all Lua files from root (excludes reference/ folder)
          cp *.lua package/apps/lua/ac-tracer/

          # Copy all configuration files
          cp *.ini package/apps/lua/ac-tracer/

          # Copy all icons
          cp *.png package/apps/lua/ac-tracer/

          # Include runtime modules, corner definitions, and reference tracks
          cp -r lib corners tracks package/apps/lua/ac-tracer/

          # Copy dwrite.dll to AC root folder (for extended brake pressure)
          # The DLL goes in assettocorsa/ (root), not in the app folder
          if [ -f "assets/dwrite.dll" ]; then
            cp assets/dwrite.dll package/
            echo "Included dwrite.dll for extended brake pressure support"
          fi

          # Create the zip file from within the package directory
          cd package
          zip -r ../ac-tracer.zip .

      - name: Verify packaged runtime files
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile

          files = [Path('ac-tracer.lua'), Path('manifest.ini')]
          for directory in ('lib', 'corners', 'tracks'):
              files.extend(path for path in Path(directory).rglob('*') if path.is_file())

          with ZipFile('ac-tracer.zip') as archive:
              bad_entry = archive.testzip()
              if bad_entry is not None:
                  raise ValueError(f'Corrupt ZIP entry: {bad_entry}')
              for path in files:
                  entry = f'apps/lua/ac-tracer/{path.as_posix()}'
                  if archive.read(entry) != path.read_bytes():
                      raise ValueError(f'Packaged file differs from source: {entry}')
          print(f'Verified {len(files)} runtime files in ac-tracer.zip')

      - name: Delete existing release
        run: |
          gh release delete latest --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          body: |
            ## AC Tracer - Content Manager Compatible Package

            **Installation:** Drag and drop `ac-tracer.zip` into Content Manager to install.

            **Extended Brake Pressure:** If `dwrite.dll` is included, it will be installed to the AC root folder to enable enhanced brake pressure telemetry from the cphys plugin.

            This release is automatically updated on every push to master.
          files: ac-tracer.zip
          make_latest: true
